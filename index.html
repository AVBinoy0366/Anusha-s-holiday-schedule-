<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e9">
<title>Bae Seok-ryu’s Live Unemployed Schedule</title>
<style>
  :root { color-scheme: light; --paper:#f5f0e9; --ink:#171717; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { min-height:100vh; min-height:100svh; display:flex; justify-content:center; align-items:center; padding:12px; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
  main { width:min(100%, 920px); }
  .clock-wrap { position:relative; width:100%; line-height:0; }
  .clock-art { display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }
  #live-hand { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  #hand-line { stroke:#153b70; stroke-width:10; stroke-linecap:round; }
  #hand-highlight { stroke:#f4cf22; stroke-width:2.2; stroke-linecap:round; }
  #hub { fill:#f4cf22; stroke:#171717; stroke-width:3; }
  #hub-label { fill:#171717; font-size:43px; font-weight:700; text-anchor:middle; dominant-baseline:middle; font-family:Arial,Helvetica,sans-serif; }
  .readout { display:flex; justify-content:center; align-items:center; gap:9px; margin:5px auto 0; font-size:12px; letter-spacing:.12em; font-weight:700; line-height:1.3; }
  .live-dot { width:7px; height:7px; flex:none; border-radius:50%; background:#3b8b55; box-shadow:0 0 0 3px #3b8b5520; }
  #digital-time { font-variant-numeric:tabular-nums; letter-spacing:.06em; }
  .hint { text-align:center; font-size:10px; color:#77716b; margin:5px 0 0; line-height:1.3; }
  @media (max-width:520px) { body { padding:5px 3px 12px; } .readout { margin-top:3px; font-size:10px; } .hint { font-size:9px; } }
</style>
</head>
<body>
<main>
  <div class="clock-wrap" role="img" aria-label="Anusha’s 24-hour unemployed schedule clock. The blue hand shows the current local time.">
    <img class="clock-art" src="https://raw.githubusercontent.com/AVBinoy0366/love-next-door-live-clock/main/clock-design.png" alt="Today’s time table">
    <svg id="live-hand" viewBox="0 0 1536 1536" aria-hidden="true">
      <line id="hand-line" x1="765" y1="715" x2="765" y2="265" />
      <line id="hand-highlight" x1="765" y1="715" x2="765" y2="265" />
      <circle id="hub" cx="765" cy="715" r="69" />
      <text id="hub-label" x="765" y="718">PLAY</text>
    </svg>
  </div>
  <div class="readout"><span class="live-dot"></span><span>LOCAL TIME</span><span id="digital-time">--:--:--</span></div>
  <p class="hint">Live 24-hour time · Updates automatically from your device</p>
</main>
<script>
(() => {
  const cx = 765, cy = 715, radius = 450;
  const line = document.getElementById('hand-line');
  const highlight = document.getElementById('hand-highlight');
  const display = document.getElementById('digital-time');
  const pad = n => String(n).padStart(2, '0');
  function updateClock() {
    const now = new Date();
    const elapsedHours = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600 + now.getMilliseconds()/3600000;
    // 00:00 aligns with 24 at the top; 06:00 right; 12:00 bottom; 18:00 left.
    const angle = elapsedHours / 24 * Math.PI * 2 - Math.PI / 2;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    line.setAttribute('x2', x); line.setAttribute('y2', y);
    highlight.setAttribute('x2', x); highlight.setAttribute('y2', y);
    display.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    // Align updates to the next second so the display remains in sync.
    window.setTimeout(updateClock, 1000 - now.getMilliseconds());
  }
  updateClock();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) updateClock(); });
})();
</script>
</body>
</html>
